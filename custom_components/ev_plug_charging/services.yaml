mark_completion_notified:
  name: Mark completion notified
  description: >-
    Claims the one-push-per-session completion latch, the way a car-confirmed
    "Finished" status does. For an external automation that detects
    completion by its own means and wants to own the notification.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: ev_plug_charging

refresh_source:
  name: Refresh source
  description: >-
    Manually requests a fresh reading from the configured telemetry source
    -- the equivalent of the automatic rescue wakeup, but on demand.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: ev_plug_charging

set_soc:
  name: Set state of charge
  description: >-
    Supplies the car's current state of charge by hand, for a source that
    is unreachable or a setup with no telemetry at all. It is used as the
    start of the next Smart charge (or corrects the one already running),
    until a real reading arrives or that charge completes.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: ev_plug_charging
    soc:
      name: State of charge
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

reset_rate_learning:
  name: Reset rate learning
  description: >-
    Clears the learned charge-rate sample buffer. Use after a capacity or
    vehicle change -- stale samples plus a new seed give a discontinuous
    session cap.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: ev_plug_charging

vehicle_command:
  name: Vehicle command
  description: >-
    Executes a named vehicle command through the configured telemetry
    source's own transport (host, VIN, timeout and error handling are
    already configured for polling -- this reuses the same connection
    rather than redeclaring it elsewhere). Fails if the source does not
    support the requested command; see its diagnostics download for the
    list it does support.
  fields:
    config_entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: ev_plug_charging
    command:
      name: Command
      required: true
      selector:
        select:
          options:
            - wake
            - lock
            - unlock
            - horn
            - flash_lights
            - precondition_start
            - precondition_stop
            - charge_start
            - charge_stop
    params:
      name: Parameters
      description: >-
        Command-specific extras, e.g. {"count": 3} for horn or
        {"duration": 20} for flash_lights. Most commands need none.
      required: false
      selector:
        object:
